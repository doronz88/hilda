name: docs

# The site is versioned with mike, which keeps every published version in the gh-pages branch:
#   - a push to main publishes `main`;
#   - a release publishes its X.Y series and moves the `latest` alias (the default) to it.
# The whole gh-pages tree is then deployed to GitHub Pages, plus root redirects that keep the
# pre-versioning URLs working (.github/docs_root_redirects.py). The github-pages environment only
# accepts deployments from main, so a release run publishes to gh-pages and then starts this
# workflow on main, which deploys.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "overrides/**"
      - "hilda/**"
      - ".github/docs_root_redirects.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "overrides/**"
      - ".github/docs_root_redirects.py"
      - ".github/workflows/docs.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Pull requests only check that the site builds; publishing builds it again with mike.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # mkdocstrings analyzes the source statically (paths: [.]), so the hilda
      # package itself does not need to be installed — only the doc tooling.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mkdocs-material>=9.5" "mkdocstrings[python]>=0.26" "mkdocs-llmstxt>=0.5" "mike>=2.1"
      - name: Build (strict)
        run: python -m mkdocs build --strict

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # mike pushes to gh-pages: one publish at a time, none cancelled half-way.
    concurrency:
      group: docs-publish
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          # mike commits on top of the gh-pages branch.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # mkdocstrings analyzes the source statically (paths: [.]), so the hilda
      # package itself does not need to be installed — only the doc tooling.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mkdocs-material>=9.5" "mkdocstrings[python]>=0.26" "mkdocs-llmstxt>=0.5" "mike>=2.1"
      - name: Build (strict)
        run: python -m mkdocs build --strict
      - name: Publish with mike
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages || true
          if [ "$EVENT" = "release" ]; then
            series="$(echo "${TAG#v}" | cut -d. -f1,2)"
            mike deploy --push --update-aliases "$series" latest
            mike set-default --push latest
          else
            mike deploy --push main
          fi
      - name: Deploy from main
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Assemble the site
        if: github.event_name != 'release'
        run: |
          git worktree add --detach "$RUNNER_TEMP/site" gh-pages
          python .github/docs_root_redirects.py "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'release'
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: publish
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
